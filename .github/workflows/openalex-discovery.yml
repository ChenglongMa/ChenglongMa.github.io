name: Sync publications from OpenAlex

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update publications from OpenAlex
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          ORCID_ID: 0000-0002-6745-4029
        run: npm run sync:publications

      - name: Create or update publication PR
        id: publication-pr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: publications.bib
          branch: automation/openalex-publications
          delete-branch: true
          commit-message: 'chore: sync publications from OpenAlex'
          title: 'chore: sync publications from OpenAlex'
          body: |
            Automated monthly update of `publications.bib` from OpenAlex.

            This PR is automatically merged and then triggers a GitHub Pages deployment.

      - name: Merge publication PR
        if: steps.publication-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.publication-pr.outputs.pull-request-number }}" --squash --delete-branch

      - name: Deploy the updated website
        if: steps.publication-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref master
