name: Sync publications from OpenAlex

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openalex-publications
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test publication discovery
        run: npm run test:publications

      - name: Update publications from OpenAlex
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          ORCID_ID: 0000-0002-6745-4029
          OPENALEX_AUTHOR_ID: A5038674041
        run: npm run sync:publications

      - name: Validate publications
        run: npm run test:content

      - name: Summarize publication discovery
        run: cat openalex-discoveries.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update publication PR
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: publications.bib
          branch: automation/openalex-publications
          delete-branch: true
          commit-message: 'chore: sync publications from OpenAlex'
          title: 'chore: sync publications from OpenAlex'
          body-path: openalex-discoveries.md
