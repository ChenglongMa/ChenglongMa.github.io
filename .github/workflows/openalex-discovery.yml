name: Discover publications with OpenAlex

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check OpenAlex for possible new works
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          ORCID_ID: 0000-0002-6745-4029
        run: node scripts/discover-openalex.mjs

      - name: Check whether candidates were found
        id: candidates
        run: |
          if grep -q '^## Candidate publications' openalex-discoveries.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a review issue
        if: steps.candidates.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('openalex-discoveries.md', 'utf8');
            const title = 'Review possible new publications from OpenAlex';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            if (issues.some((issue) => issue.title === title)) {
              core.notice('A publication-review issue is already open.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });
